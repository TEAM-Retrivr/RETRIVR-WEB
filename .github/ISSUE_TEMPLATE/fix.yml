name: Fix
description: 버그 수정
title: "[RTR-] "
labels: ["Fix"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug / Task Description
      description: 재현 방법, 기대 동작, 실제 동작을 적어주세요.
      placeholder: 무엇이 깨졌는지 / 어떻게 재현하는지
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: TO-DO
      value: |
        - [ ] 원인 확인
        - [ ] 수정
        - [ ] 검증
    validations:
      required: false
  - type: textarea
    id: etc
    attributes:
      label: ETC
    validations:
      required: false
